name: Android verification and signed releases
on:
  pull_request:
    branches: [main-adb]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [closed]
  push:
    branches: [main-adb]
env:
  APP: MorpheAutoMirror
  RELEASE_TRACK: adb
permissions:
  contents: write
concurrency:
  group: morphe-adb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main-adb') || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
      - name: Assert single direct-surface renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/java/dev/n2k02/morpheautomirror/MirrorForegroundService.kt").read_text()
          activity = Path("app/src/main/java/dev/n2k02/morpheautomirror/MainActivity.kt").read_text()
          gradle = Path("app/build.gradle.kts").read_text()
          settings = Path("settings.gradle.kts").read_text()
          assert '"morphe-direct"' in source and 'display.setSurface(target.surface)' in source
          assert 'GeckoView' not in source and 'FrameCaptureServer' not in source
          assert 'GeckoView' not in activity and 'Rendering" ->' not in activity
          assert 'geckoview' not in gradle.lower() and 'maven.mozilla.org' not in settings
          for name in ['GeckoViewMirror.kt','FrameCaptureServer.kt','StreamAccess.kt']:
              assert not Path("app/src/main/java/dev/n2k02/morpheautomirror", name).exists()
          print("Direct Surface contract OK")
          PY
      - name: Validate ADB release contract
        run: python3 .github/scripts/test_adb_release_contract.py
      - name: Kotlin unit tests, Android lint and minified release build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: morphe-adb-verification-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
  release:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main-adb')
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
      SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
      - name: Validate signing availability
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_PASSPHRASE" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              echo "::warning::SIGNING_PASSPHRASE missing; debug artifact only."
              echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            else
              echo "::error::Stable releases require SIGNING_PASSPHRASE"
              exit 1
            fi
          else
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          fi
      - name: Resolve mRadio-compatible release version and notes
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/version_code.py --self-test
          git fetch --tags --force
          local_last=$(git tag -l 'v[0-9]*' | sed -nE 's/^v([0-9]+[.][0-9])$/\1/p' | sort -V | tail -1 || true)
          release_last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' | sed -nE 's/^(v|adb-v)([0-9]+[.][0-9])$/\2/p' | sort -V | tail -1 || true)
          last=$(printf '%s\n%s\n' "$local_last" "$release_last" | sed '/^$/d' | sort -V | tail -1 || true)
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            ver="${last:-1.0}"
            if [[ -n "$last" ]]; then
              n=$(( ${last%.*} * 10 + ${last#*.} + 1 ))
              ver="$(( n / 10 )).$(( n % 10 ))"
            fi
          elif [[ -z "$last" ]]; then
            ver=1.0
          else
            n=$(( ${last%.*} * 10 + ${last#*.} + 1 ))
            ver="$(( n / 10 )).$(( n % 10 ))"
          fi
          if [[ "$GITHUB_EVENT_NAME" != pull_request && -n "$last" ]]; then
            [[ "$(printf '%s\n%s\n' "$last" "$ver" | sort -V | tail -1)" == "$ver" && "$ver" != "$last" ]] || { echo "::error::Stable version must advance from $last"; exit 1; }
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(python3 .github/scripts/version_code.py "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER")" >> "$GITHUB_ENV"
          echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          echo "APK_NAME=MorpheAutoMirror-ADB-$ver" >> "$GITHUB_ENV"
          prev=""
          [[ -n "$last" ]] && git rev-parse -q --verify "refs/tags/v$last" >/dev/null && prev="v$last" || true
          if [[ -n "$prev" ]]; then range="$prev..HEAD"; else range=HEAD; fi
          changes=$(git log --no-merges --pretty='- %s' "$range" | head -40 || true)
          {
            echo "## MorpheAutoMirror $ver"
            echo "Version code: $(python3 .github/scripts/version_code.py "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER")"
            echo
            echo "### What's new"
            echo "${changes:-- Rebuild, no code changes}"
            echo
            echo "### Install"
            echo "Download the signed APK from this release."
          } > release-notes.md
      - name: Use mRadio experimental release naming
        if: github.event_name == 'pull_request' && env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/experimental_naming.py --self-test
          GITHUB_ENV="$RUNNER_TEMP/architecture-naming.env" python3 .github/scripts/experimental_naming.py "$GITHUB_REPOSITORY" MorpheAutoMirror "$GITHUB_RUN_NUMBER" "${{ github.event.pull_request.number }}"
          grep -v '^APK_NAME=' "$RUNNER_TEMP/architecture-naming.env" >> "$GITHUB_ENV"
          base=$(sed -n 's/^VERSION=//p' "$RUNNER_TEMP/architecture-naming.env")
          suffix=$(sed -n 's/^VERSION_SUFFIX=//p' "$RUNNER_TEMP/architecture-naming.env")
          echo "APK_NAME=MorpheAutoMirror-ADB-$base$suffix" >> "$GITHUB_ENV"
      - name: Validate architecture-qualified APK filename
        if: env.SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="$APP-${RELEASE_TRACK^^}-$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            [[ "$VERSION_SUFFIX" =~ ^-experimental[.][0-9]+$ ]] || { echo "::error::Invalid experimental suffix"; exit 1; }
            expected="$expected$VERSION_SUFFIX"
          else
            [[ -z "$VERSION_SUFFIX" ]] || { echo "::error::Stable APK has an experimental suffix"; exit 1; }
          fi
          [[ "$APK_NAME" == "$expected" ]] || { echo "::error::Wrong APK name: $APK_NAME (expected $expected)"; exit 1; }
      - name: Label experimental release notes
        if: github.event_name == 'pull_request' && env.SIGNING_READY == 'true'
        run: |
          sed -i "1s|^## .*|## $EXPERIMENTAL_TITLE|" release-notes.md
          printf '\nExperimental sequence: %s\n' "$EXPERIMENTAL_NUMBER" >> release-notes.md
      - name: Build release and sign with mRadio lineage
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX"
          K="$RUNNER_TEMP/keys"
          mkdir -p "$K"
          chmod 700 "$K"
          trap 'rm -rf "$K"' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/keys.tar.enc -pass env:SIGNING_PASSPHRASE | tar -xf - -C "$K"
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          export RP=$(cat "$K/release.pass") OP=android
          "$BT/apksigner" rotate --out "$K/lineage" \
            --old-signer --ks "$K/old.keystore" --ks-pass env:OP --ks-key-alias androiddebugkey --key-pass env:OP \
            --new-signer --ks "$K/release.p12" --ks-pass env:RP --ks-key-alias release --key-pass env:RP
          "$BT/apksigner" sign \
            --ks "$K/old.keystore" --ks-pass env:OP --ks-key-alias androiddebugkey --key-pass env:OP \
            --next-signer --ks "$K/release.p12" --ks-pass env:RP --ks-key-alias release --key-pass env:RP \
            --lineage "$K/lineage" --rotation-min-sdk-version 28 \
            --out "$APK_NAME.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --print-certs "$APK_NAME.apk"
      - name: Upload signed APK
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}.apk
          path: ${{ env.APK_NAME }}.apk
          retention-days: 30
      - name: Publish experimental prerelease or stable release
        if: env.SIGNING_READY == 'true' && !github.event.pull_request.draft
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            TAG="experimental-adb-pr-${{ github.event.pull_request.number }}-run-$GITHUB_RUN_NUMBER"
            TITLE="MorpheAutoMirror $VERSION experimental PR #${{ github.event.pull_request.number }}"
            TARGET="${{ github.event.pull_request.head.sha }}"
            EXTRA=(--prerelease --latest=false)
          else
            TAG="adb-v$VERSION"
            TITLE="MorpheAutoMirror $VERSION"
            TARGET="${{ github.event.pull_request.merge_commit_sha }}"
            EXTRA=(--latest=false)
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then TITLE="$EXPERIMENTAL_TITLE · ADB"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Preserving its published assets."
            exit 0
          else
            gh release create "$TAG" "$APK_NAME.apk" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "$TITLE" --notes-file release-notes.md "${EXTRA[@]}"
          fi

