name: Android verification and signed releases
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional next stable version, e.g. 1.2'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: morphe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
      - name: Checkout shared N2K02 theme
        uses: actions/checkout@v7
        with:
          repository: N2K02/n2k02theme
          path: shared/n2k02theme
          persist-credentials: false
      - name: Checkout shared N2K02 updater
        uses: actions/checkout@v7
        with:
          repository: N2K02/n2k02updater
          path: shared/n2k02updater
          persist-credentials: false
      - name: Kotlin unit tests, Android lint and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PuseSharedSources=true
      - uses: actions/upload-artifact@v7
        with:
          name: MorpheAutoMirror-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  release:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
      - name: Checkout shared theme for release
        uses: actions/checkout@v7
        with:
          repository: N2K02/n2k02theme
          path: shared/n2k02theme
          persist-credentials: false
      - name: Checkout shared updater for release
        uses: actions/checkout@v7
        with:
          repository: N2K02/n2k02updater
          path: shared/n2k02updater
          persist-credentials: false
      - name: Validate signing availability
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_KEY_ALIAS" || -z "$SIGNING_KEY_PASSWORD" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              echo "::warning::Signing secrets missing; debug artifact only."
              echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            else
              echo "::error::Stable releases require signing secrets"
              exit 1
            fi
          else
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          fi
      - name: Resolve mRadio-compatible release version and notes
        if: env.SIGNING_READY == 'true'
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/version_code.py --self-test
          git fetch --tags --force
          local_last=$(git tag -l 'v[0-9]*' | sed -nE 's/^v([0-9]+[.][0-9])$/\\1/p' | sort -V | tail -1 || true)
          release_last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' | sed -nE 's/^v([0-9]+[.][0-9])$/\\1/p' | sort -V | tail -1 || true)
          last=$(printf '%s\\n%s\\n' "$local_last" "$release_last" | sed '/^$/d' | sort -V | tail -1 || true)
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            ver="${last:-1.0}"
            if [[ -n "$last" ]]; then
              n=$(( ${last%.*} * 10 + ${last#*.} + 1 ))
              ver="$(( n / 10 )).$(( n % 10 ))"
            fi
          elif [[ -n "$REQUESTED" ]]; then
            [[ "$REQUESTED" =~ ^[0-9]+\\.[0-9]$ ]] || { echo "::error::Version must be N.N"; exit 1; }
            ver="$REQUESTED"
          elif [[ -z "$last" ]]; then
            ver=1.0
          else
            n=$(( ${last%.*} * 10 + ${last#*.} + 1 ))
            ver="$(( n / 10 )).$(( n % 10 ))"
          fi
          if [[ "$GITHUB_EVENT_NAME" != pull_request && -n "$last" ]]; then
            [[ "$(printf '%s\\n%s\\n' "$last" "$ver" | sort -V | tail -1)" == "$ver" && "$ver" != "$last" ]] || { echo "::error::Stable version must advance from $last"; exit 1; }
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(python3 .github/scripts/version_code.py "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER")" >> "$GITHUB_ENV"
          echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          echo "APK_NAME=MorpheAutoMirror-$ver" >> "$GITHUB_ENV"
          prev=""
          [[ -n "$last" ]] && git rev-parse -q --verify "refs/tags/v$last" >/dev/null && prev="v$last" || true
          if [[ -n "$prev" ]]; then range="$prev..HEAD"; else range=HEAD; fi
          changes=$(git log --no-merges --pretty='- %s' "$range" | head -40 || true)
          {
            echo "## MorpheAutoMirror $ver"
            echo "Version code: $(python3 .github/scripts/version_code.py "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER")"
            echo
            echo "### What's new"
            echo "${changes:-- Rebuild, no code changes}"
            echo
            echo "### Install"
            echo "Download the signed APK from this release."
          } > release-notes.md
      - name: Use mRadio experimental release naming
        if: github.event_name == 'pull_request' && env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/experimental_naming.py --self-test
          python3 .github/scripts/experimental_naming.py "$GITHUB_REPOSITORY" MorpheAutoMirror "$GITHUB_RUN_NUMBER" "${{ github.event.pull_request.number }}"
      - name: Label experimental release notes
        if: github.event_name == 'pull_request' && env.SIGNING_READY == 'true'
        run: |
          sed -i "1s|^## .*|## $EXPERIMENTAL_TITLE|" release-notes.md
          printf '\\nExperimental sequence: %s\\n' "$EXPERIMENTAL_NUMBER" >> release-notes.md
      - name: Build signed release variant
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          mkdir -p signing
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing/release.jks
          chmod 600 signing/release.jks
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX" -PuseSharedSources=true
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME.apk"
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs "$APK_NAME.apk"
          rm -f signing/release.jks
      - name: Upload signed APK
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
          retention-days: 30
      - name: Publish experimental prerelease or stable release
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            TAG="experimental-pr-${{ github.event.pull_request.number }}-run-$GITHUB_RUN_NUMBER"
            TITLE="MorpheAutoMirror $VERSION experimental PR #${{ github.event.pull_request.number }}"
            TARGET="${{ github.event.pull_request.head.sha }}"
            EXTRA=(--prerelease --latest=false)
          else
            TAG="v$VERSION"
            TITLE="MorpheAutoMirror $VERSION"
            TARGET="$GITHUB_SHA"
            EXTRA=(--latest)
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then TITLE="$EXPERIMENTAL_TITLE"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              gh release upload "$TAG" "$APK_NAME.apk" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "::error::Stable release tag already exists: $TAG"; exit 1
            fi
          else
            gh release create "$TAG" "$APK_NAME.apk" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "$TITLE" --notes-file release-notes.md "${EXTRA[@]}"
          fi

